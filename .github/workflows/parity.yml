name: Run notebook parity tests

on:
  pull_request:
    branches: main
    paths:
      - "pysyncon/**"
      - "tests/**"
      - "parity_tests/**"
  push:
    branches: main
    paths:
      - "pysyncon/**"
      - "tests/**"
      - "parity_tests/**"

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.0.2 scipy==1.13.1 pandas==2.3.3 matplotlib==3.9.4
          python -m pip install -r requirements-dev.txt
      - name: Run parity tests
        run: python -m unittest discover -s parity_tests
